<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Events Manager</title>
  </head>
  <body>
    <div class="container">
      <div class="add-box">
        <h2>Add Event</h2>
        <input type="text" class="event-name" placeholder="Event Name" />
        <input type="text" class="organizer" placeholder="Event Organizer" />
        <input type="date" class="event-date" />
        <button class="add">Add Event</button>
      </div>
      <div class="events"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
